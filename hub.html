<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b85a3a">
<title>Библейские истории · альбом</title>
<script>
(function(){try{var t=localStorage.getItem("bible_theme");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content","#5c2e1f");}}catch(e){}})();
</script>
<link rel="stylesheet" href="core/engines/quest/quest.css">
<style>
  /* встраивание в оболочку тома: без собственной нижней навигации и дублирующей шапки */
  html.embed, html.embed body{height:100%;margin:0;overflow:hidden}
  html.embed body{padding-bottom:0!important}
  html.embed #botmenu{display:none!important}
  html.embed header{display:none!important}
  html.embed main{height:100%;max-height:100dvh;overflow:auto;-webkit-overflow-scrolling:touch}
  html.embed body.hasmenu main{padding-bottom:12px}
  /* стройка: колонка на всю высоту iframe (над #bnav оболочки) */
  html.embed main.buildmode{height:100%;max-height:100%;overflow:hidden;padding-bottom:12px}
  html.embed #app:has(main.buildmode){height:100%;max-height:100%;overflow:hidden}
  /* при fullscreen-оверлее оболочки iframe = весь экран — карта использует полную высоту */
  html.embed #cardview .frame{width:min(97vw,calc(100dvh * 0.6667));max-height:96dvh}
  html[data-theme="dark"]{--cream:#2a1a1c;--bordo:#d47855;--accent:#d47855;--accent-d:#f0d889;--ink:#f5efe4;--muted:#cbb8a8;--orange:#E06104;--line:rgba(245,239,228,.16);--card:rgba(255,255,255,.08);--panel:rgba(255,255,255,.06);--ok-bg:rgba(62,142,77,.28);--no-bg:rgba(178,59,59,.28)}
  html[data-theme="dark"] body{background:#2a1a1c;color:#f5efe4}
  html[data-theme="dark"] header{background:#3a2226;box-shadow:0 2px 12px rgba(0,0,0,.35)}
  /* Стройка / подписи игр: светлый текст на тёмном холсте */
  html[data-theme="dark"] .buildcap,
  html[data-theme="dark"] .buildcount,
  html[data-theme="dark"] .gamewrap .topbar .sc,
  html[data-theme="dark"] .topbar.gamewrap .sc,
  html[data-theme="dark"] .hint{color:var(--ink)}
  html[data-theme="dark"] .buildcount,
  html[data-theme="dark"] .hint{color:var(--muted)}
  html[data-theme="dark"] .gamehub .gbtn{
    background:var(--card);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
  html[data-theme="dark"] .gamehub .gbtn .nm{color:var(--ink)}
  html[data-theme="dark"] .gamehub .gbtn:active{box-shadow:none}
  /* Словарик в iframe хаба */
  html[data-theme="dark"] .gitem{
    background:var(--card);border:1px solid var(--line);box-shadow:none;color:var(--ink)}
  html[data-theme="dark"] .gitem .w{color:var(--accent-d)}
  html[data-theme="dark"] .gitem .d{color:var(--muted)}
  html[data-theme="dark"] .gitem .refs .chip{
    background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);box-shadow:none}
  /* Мини-игры в iframe: варианты / HUD / чипы без белых плашек */
  html[data-theme="dark"] .qopts .opt,
  html[data-theme="dark"] .artrow .opt,
  html[data-theme="dark"] .ordlist .opt,
  html[data-theme="dark"] .wslots .ws,
  html[data-theme="dark"] .wchips .wch,
  html[data-theme="dark"] .scchip,
  html[data-theme="dark"] .scday,
  html[data-theme="dark"] .arkgrid .ak,
  html[data-theme="dark"] .tmgrid .tmmat,
  html[data-theme="dark"] .edzoo .edan,
  html[data-theme="dark"] .pzgrid,
  html[data-theme="dark"] .qbox,
  html[data-theme="dark"] .qdigit,
  html[data-theme="dark"] .qmapblurb,
  html[data-theme="dark"] .mapinfo,
  html[data-theme="dark"] .seastep,
  html[data-theme="dark"] .memcard .inner{
    background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:none}
  html[data-theme="dark"] .artrow .opt .nm,
  html[data-theme="dark"] .memcard .inner .nm{background:rgba(0,0,0,.35);color:var(--ink)}
  html[data-theme="dark"] .scday .dn,
  html[data-theme="dark"] .tmgrid .tmmat .nm,
  html[data-theme="dark"] .edzoo .edan .tag{color:var(--ink)}
  html[data-theme="dark"] .qopts .opt.ok,
  html[data-theme="dark"] .ordlist .opt.placed,
  html[data-theme="dark"] .scday.on,
  html[data-theme="dark"] .wslots .ws.on{background:var(--ok-bg)}
  html[data-theme="dark"] .qopts .opt.no,
  html[data-theme="dark"] .ordlist .opt.shake{background:var(--no-bg)}
  html[data-theme="dark"] .gamewrap .topbar .bt,
  html[data-theme="dark"] .topbar.gamewrap .bt{color:var(--accent-d)}
  html[data-theme="dark"] .qstage .qq,
  html[data-theme="dark"] .qq{color:var(--accent-d)}
  html[data-theme="dark"] .mnfield .mn{background:var(--card);border-color:var(--line)}

</style>
</head>
<body>
<!-- Хаб тома (карты / книги / стройка / словарик / мини-игры).
     Оболочка index.html встраивает эту страницу iframe’ом (?embed=1&go=…).
     Прямой заход тоже работает — с нижним меню FEED_MENU.
     go=games — хаб мини-игр; go=build — стройка (отдельно). -->
<div id="app"></div>
<script src="data/volume.js"></script>
<script src="data/poster_overlay.js"></script>
<script src="sims.js"></script>
<script src="nav.js"></script>
<script src="core/engines/quest/quest.js"></script>
</body>
</html>
