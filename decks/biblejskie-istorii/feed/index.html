   Как у Птиц мира (singleMenu): кольцо уровня открывает граф + путь по главам. */

<script src="../../../core/engines/feed/feed.js"></script>

<script src="quiz-lock.js"></script>
<script>
(function () {
  if (window.BibleI18nRuntime) BibleI18nRuntime.boot();
  document.getElementById("hud").addEventListener("click", function (e) {
    if (!e.target.closest("#lvlRing, #chapPos")) return;
    var lab = document.getElementById("chapLab");
    if (lab && !lab.contains(e.target)) lab.click();
  });
  function bindSheet(id, closeId) {
    var el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("click", function (e) {
      if (e.target !== el) return;
      var btn = document.getElementById(closeId);
      if (btn) btn.click();
    });
  }
  bindSheet("parent", "pClose");
  bindSheet("map", "mClose");
  var back = document.getElementById("feedBack");
  if (back) back.addEventListener("click", function (ev) {
    ev.preventDefault();
    ev.stopPropagation();
    var embed = /[?&]embed=1/.test(location.search) || document.documentElement.classList.contains("embed");
    if (embed && window.parent && window.parent !== window) {
      try { window.parent.postMessage({ type: "bibleShell", action: "nav", to: "menu" }, "*"); return; }
      catch (e) {}
    }
    location.href = "../index.html#/";
  });
  if (!/[?&]parent=1/.test(location.search)) return;
  function openParent() {
    var lab = document.getElementById("chapLab");
    if (lab) lab.click();
  }
  if (document.readyState === "complete") setTimeout(openParent, 80);
  else window.addEventListener("load", function () { setTimeout(openParent, 80); });
})();
</script>
