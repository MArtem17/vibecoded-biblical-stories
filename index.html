<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Библейские истории</title>
<meta name="theme-color" content="#b85a3a">
<script>
(function(){try{var t=localStorage.getItem("bible_theme");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content","#5c2e1f");}}catch(e){}})();
</script>
<link rel="stylesheet" href="shell.css">
</head><body class="mode-splash">

<!-- Заставка -->
<div id="pgSplash" class="on">
  <div class="splash">
    <img class="splash-bg" src="img/splash_hero.webp" alt="" width="1536" height="1024" decoding="async" fetchpriority="high">
    <div class="splash-veil" aria-hidden="true"></div>
    <button type="button" class="splash-settings" id="settingsBtn" aria-label="Настройки" title="Настройки" data-i18n-aria="settings" data-i18n-title="settings">
      <img src="img/icons/settings.svg" width="44" height="44" alt="">
    </button>
    <div class="splash-inner">
      <p class="splash-brand" data-i18n="brand">Библейские истории</p>
      <h1 class="splash-title" data-i18n="splashTitle">Великие истории Библии — для маленьких исследователей</h1>
      <p class="splash-lead" data-i18n="splashLead">Лента эпох, альбом карт, книги и стройки</p>
      <div class="splash-cta">
        <button type="button" class="splash-go" data-go="feed" data-i18n="goFeed">В путь</button>
        <div class="splash-nav" role="navigation" aria-label="Разделы" data-i18n-aria="sections">
          <button type="button" data-go="hub" data-hub-tab="cards" data-i18n="cards">Карты</button>
          <button type="button" data-go="hub" data-hub-tab="books" data-i18n="books">Книги</button>
          <button type="button" data-go="hub" data-hub-tab="build" data-i18n="build">Стройка</button>
          <button type="button" data-go="games" data-i18n="games">Игры</button>
          <button type="button" data-go="hub" data-hub-tab="glossary" data-i18n="glossary">Словарик</button>
          <button type="button" data-go="parent" data-i18n="parents">Родителям</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="sheet" id="shSettings">
  <div class="panel">
    <div class="grab"></div>
    <div class="ph"><div><h3 data-i18n="settings">Настройки</h3></div>
      <button class="xclose" data-close="shSettings" type="button">&#x2715;</button></div>
    <div class="set-block">
      <span class="set-lab" id="langLab" data-i18n="language">Язык</span>
      <div class="set-langs" id="langsel" role="tablist" aria-label="Язык / Language"></div>
    </div>
    <div class="set-block">
      <span class="set-lab" data-i18n="theme">Тема</span>
      <div class="set-themes" role="group" aria-label="Тема">
        <button type="button" class="set-theme" data-theme="light" data-i18n="themeLight">Светлая</button>
        <button type="button" class="set-theme" data-theme="dark" data-i18n="themeDark">Тёмная</button>
      </div>
    </div>
  </div>
</div>

<!-- Лента (iframe) -->
<div id="pgFeed"></div>

<!-- Родителям -->
<div id="pgParent">
  <div class="parent-gate" id="parentGate">
    <p data-i18n="parentAdult">Раздел для взрослых</p>
    <div class="gq" id="gateQ">2 + 2 = ?</div>
    <input id="gateIn" type="number" inputmode="numeric" placeholder="Ответ">
    <div style="margin-top:12px"><button class="qcard" type="button" id="gateGo" style="justify-content:center"><b data-i18n="parentOpen">Открыть</b></button></div>
    <p id="gateErr" style="color:#c43c2e;margin-top:8px"></p>
  </div>
  <div id="parentBox" style="display:none">
    <div class="parent-box"><h4 data-i18n="stats">Статистика</h4><ul id="pStats"></ul></div>
    <button class="qcard" id="contFeed" type="button"><span class="qi">&#x1F4DC;</span><span class="txt"><b data-i18n="contFeed">Продолжить путь</b><small data-i18n="contFeedSub">Вернуться в ленту эпох</small></span></button>
    <button class="qcard" id="openHub" type="button"><span class="qi">&#x1F0CF;</span><span class="txt"><b data-i18n="openHub">Открыть альбом</b><small data-i18n="openHubSub">Карты, книги и стройки</small></span></button>
  </div>
</div>

<!-- Хаб: шапка + вкладки + iframe hub.html -->
<header id="appHeader">
  <div class="hrow">
    <button class="enc-back" id="encBack" type="button" data-i18n="menu">← Меню</button>
    <div class="brand">
      <div class="mark"><img src="img/icons/scroll-mark.webp" alt=""></div>
      <div><b id="appTitle">Библейские истории</b><span class="sub" id="appSub">Библия: великие истории</span></div>
    </div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
</header>
<main>
  <section class="view on" id="v-hub"></section>
</main>

<div class="sheet" id="shHub">
  <div class="panel">
    <div class="grab"></div>
    <div class="ph"><div><h3 data-i18n="hub">Альбом</h3><p data-i18n="hubLook">Карты, книги, стройка и словарик</p></div>
      <button class="xclose" data-close="shHub" type="button">&#x2715;</button></div>
    <div class="encgrid">
      <button class="enctile" type="button" data-enc="cards"><span>&#x1F0CF;</span><span data-i18n="cards">Карты</span></button>
      <button class="enctile" type="button" data-enc="books"><span>&#x1F4D6;</span><span data-i18n="books">Книги</span></button>
      <button class="enctile" type="button" data-enc="build"><span>&#x1F528;</span><span data-i18n="build">Стройка</span></button>
      <button class="enctile" type="button" data-enc="glossary"><span>&#x1F50D;</span><span data-i18n="glossary">Словарик</span></button>
    </div>
  </div>
</div>

<nav id="bnav">
  <button data-nav="feed" class="on" type="button">
    <img class="navico" src="img/icons/scroll-mark.webp" alt="">
    <small data-i18n="goFeed">В путь</small>
  </button>
  <button data-nav="hub" type="button">
    <img class="navico" src="img/icons/cards-mark.webp" alt="">
    <small data-i18n="hub">Альбом</small>
  </button>
  <button data-nav="games" type="button">
    <img class="navico" src="img/icons/puzzle-mark.webp" alt="">
    <small data-i18n="games">Игры</small>
  </button>
  <button data-nav="parent" type="button">
    <img class="navico" src="img/icons/family-mark.webp" alt="">
    <small data-i18n="parents">Родителям</small>
  </button>
</nav>

<script src="data/volume.js"></script>
<script src="nav.js"></script>
<script src="ui.i18n.js"></script>
<script src="app.js"></script>
</body></html>
